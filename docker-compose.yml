version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: skywind
    ports:
      - "54321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/Skywind.sql:/docker-entrypoint-initdb.d/Skywind.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skywind.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - db

  order-service:
    build: ./backend/order-service
    ports:
      - "5004:5000"
    depends_on:
      - db
      - inventory-service

  product-service:
    build: ./backend/product-service
    ports:
      - "5001:5001"
    depends_on:
      - db

  inventory-service:
    build: ./backend/inventory-service
    ports:
      - "5002:5002"
    depends_on:
      - db

  user-service:
    build: ./backend/user-service
    ports:
      - "5003:5003"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - order-service
      - product-service
      - inventory-service
      - user-service

  # ✅ API GATEWAY — đúng vị trí
  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - order-service
      - product-service
      - inventory-service
      - user-service

volumes:
  pgdata: