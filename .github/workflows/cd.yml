name: CD Pipeline

on:
  workflow_run:
    workflows: ["Python CI"]  # chạy sau khi CI pass
    branches: [main]
    types:
      - completed

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push order-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/order-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-order-service:latest

      - name: Build & Push product-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/product-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-product-service:latest

      - name: Build & Push user-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/user-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-user-service:latest

      - name: Build & Push auth-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/auth-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-auth-service:latest

      - name: Build & Push admin-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/admin-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-admin-service:latest

      - name: Build & Push inventory-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/inventory-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-inventory-service:latest

      - name: Build & Push payment-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/payment-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-payment-service:latest

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v4
        with:
          context: ./backend/api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-api-gateway:latest

      - name: Build & Push ai-service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/ai-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-ai-service:latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skywind-frontend:latest